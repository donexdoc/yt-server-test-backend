version: "3.8"

services:
  app:
    image: server-test:latest
    deploy:
      mode: replicated
      replicas: ${APP_INSTANCES:-1}
      resources:
        limits:
          cpus: "${CPU_LIMIT:-0.75}"
          memory: "${MEMORY_LIMIT:-1G}"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
    configs:
      - source: nginx_conf
        target: /etc/nginx/nginx.conf
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: "${NGINX_CPU_LIMIT:-0.25}"
          memory: "${NGINX_MEMORY_LIMIT:-128M}"
    networks:
      - app_network

configs:
  nginx_conf:
    external: true

networks:
  app_network:
    driver: overlay
