stages:
  - deploy

deploy:
  tags:
    - test
  variables:
    HOST: 192.168.1.40
    USERNAME: donex
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh git
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
  script:
    - ssh -i ~/.ssh/id_ed25519 "$USERNAME@$HOST" '
      cd /home/donex/yt-server-test-backend &&
      git pull origin main &&
      docker-compose down &&
      docker-compose up -d --build
      '
  only:
    - main
